# =====================================================================
# CẤU HÌNH HỆ THỐNG BINANCE PATTERN-MATCHING SIGNAL BOT (M5)
# Hệ thống bắn tín hiệu kỹ thuật (Signal-Only Alert System)
# =====================================================================

system:
  symbol: "XAUUSDT"             # Cặp giao dịch Binance Futures (XAUUSDT - Vàng vĩnh cửu)
  timeframe: "M5"                # Khung thời gian M5 (5 phút)
  timezone: "UTC"                # Múi giờ chuẩn hóa
  log_level: "INFO"              # DEBUG, INFO, WARNING, ERROR

# Kết nối API Binance Futures (Public API, không cần API Key để lấy dữ liệu)
binance:
  symbol: "XAUUSDT"
  interval: "5m"
  base_url: "https://fapi.binance.com"
  ws_url: "wss://fstream.binance.com/ws"
  market_type: "futures"         # "futures" cho XAUUSDT
  timeout_sec: 10.0

# Module 1: Bộ lọc trạng thái khối lượng (Volume Regime Filter)
volume_filter:
  window_size: 100               # Cửa sổ trượt 100 nến M5
  lower_percentile: 20.0         # Ngưỡng phân vị dưới P20 (bỏ qua thanh khoản mỏng)
  upper_percentile: 85.0         # Ngưỡng phân vị trên P85 (bỏ qua bão biến động đột biến)

# Module 2: Trích xuất đặc trưng (Feature Engineering)
feature_extractor:
  window_size: 15                # Cửa sổ nến setup (t-14 đến t)
  rsi_period: 7                  # Chu kỳ RSI ngắn hạn
  vol_zscore_period: 20          # Chu kỳ tính Z-Score Volume
  atr_period: 14                 # Chu kỳ ATR đo biến động
  epsilon: 1e-6                  # Hệ số chống chia cho 0

# Module 3 & 4: Động cơ so khớp vector (Similarity Engine)
similarity_engine:
  min_similarity: 0.85           # Ngưỡng Cosine Similarity tối thiểu (85%)
  min_neighbors: 10              # Số lượng mẫu khớp tối thiểu (k >= 10)
  consensus_ratio: 0.80          # Tỷ lệ đồng thuận hướng đi (80%)
  backend: "faiss"               # "faiss" hoặc "sklearn"

# Module 4 & 5: Quản trị rủi ro & Định dạng tín hiệu (Risk Management)
risk_manager:
  swing_window: 15               # Cửa sổ tìm đỉnh/đáy Swing Low/High
  buffer_usd: 2.0                # Vùng đệm Stop Loss cho Vàng (~2 USD)
  min_rr_ratio: 1.5              # Tỷ lệ R:R tối thiểu (1.5)
  risk_percent: 1.0              # Tỷ lệ rủi ro tham khảo (% vốn)
  min_sl_usd: 3.0                # Khoảng cách SL tối thiểu cho Vàng ($3)
  max_sl_usd: 80.0               # Khoảng cách SL tối đa cho 1 nhịp M5 của Vàng

# Module 5: Giám sát và Bắn tín hiệu (Signal Alerting)
execution:
  mode: "signal"                 # Chế độ phát tín hiệu cảnh báo ("signal")
  poll_interval_sec: 2.0         # Tần suất kiểm tra polling dự phòng (giây)

# Module AI: XGBoost Classifier & Hybrid Ensemble
xgboost:
  enabled: true
  model_path: "models/xgboost_hybrid.json"
  min_confidence: 0.45           # Ngưỡng xác suất tối thiểu để xác nhận

ensemble:
  mode: "hybrid"                 # "hybrid" (FAISS + XGBoost), "faiss_only", "xgboost_only"
  min_xgboost_prob: 0.45         # Ngưỡng đồng thuận từ XGBoost
  blend_weight_faiss: 0.50       # Trọng số điểm tin cậy FAISS (50%)
  blend_weight_xgboost: 0.50     # Trọng số điểm tin cậy XGBoost (50%)

# Đường dẫn lưu trữ tập tin
paths:
  raw_data: "data/raw/xauusdt_m5.parquet"
  pattern_db: "data/patterns/winning_patterns.parquet"
  xgboost_model: "models/xgboost_hybrid.json"
  logs_dir: "logs"
